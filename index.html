<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koji's Focus Shield Central Command</title>
  <style>
    body {
      background-color: #f4f7f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #2c3e50;
      overflow: hidden;
    }
    #mediaForcefieldOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 9999;
      background: transparent;
      cursor: pointer;
      display: none;
    }
    .panel-container {
      width: 95%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    .setup-theme { border-top: 10px solid #2d5a27; }
    .intercept-theme { border-top: 10px solid #e74c3c; }
    .paywall-theme { border-top: 10px solid #4caf50; }
    
    .koji-brand img {
      width: 85px; height: 85px;
      object-fit: contain; border-radius: 50%;
      background-color: #e2ebd9; padding: 5px; margin-bottom: 12px;
    }
    .guard-dog-img {
      width: 750px; height: 380px;
      max-width: 140%; object-fit: contain;
      margin-bottom: -55px; margin-top: -70px;
      transform: scale(1.9);
    }
    h1 { margin: 0 0 10px 0; font-size: 28px; font-weight: 800; }
    .text-setup { color: #2d5a27; }
    .text-intercept { color: #c0392b; }
    
    .trial-tag {
      background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404;
      padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 25px; font-size: 13px;
    }
    .card-workspace {
      background: #fdfdfd; border: 1px solid #eef2f0;
      padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left;
    }
    h3 { margin: 0 0 8px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #7f8c8d; }
    textarea {
      width: 100%; height: 55px; box-sizing: border-box; border: 1px solid #ccc;
      border-radius: 6px; padding: 8px; font-family: inherit; resize: none;
    }
    .btn {
      text-decoration: none; padding: 15px 35px; border-radius: 8px;
      font-weight: 900; font-size: 18px; cursor: pointer; border: none;
      display: inline-block; box-sizing: border-box; transition: background 0.2s;
    }
    .btn-block { width: 100%; }
    .btn-mind { background-color: #2d5a27; color: white; margin-top: 5px; padding: 10px; font-size: 14px; }
    .btn-deploy { background-color: #e74c3c; color: white; box-shadow: 0 4px 12px rgba(231,76,60,0.2); }
    .btn-deploy:hover { background-color: #c0392b; }
    .btn-active { background-color: #2d5a27 !important; }
    .btn-group { display: flex; gap: 15px; width: 100%; margin-top: 15px; }
    .btn-return { background-color: #2d5a27; color: white; flex: 1; }
    .btn-return:hover { background-color: #21431d; }
    .btn-bypass { background-color: #7f8c8d; color: white; font-size: 15px; }
    .btn-subscribe { background-color: #4caf50; color: white; font-size: 22px; width: 100%; margin-top: 15px; }
    
    .clock-display { font-size: 42px; font-weight: bold; color: #c0392b; letter-spacing: 1px; margin: 10px 0; text-align: center; }
    .dump-feed { max-height: 65px; overflow-y: auto; font-size: 12px; padding-left: 20px; margin: 5px 0 0 0; }
  </style>
</head>
<body>

  <!-- Full-screen interaction layer to instantly deploy loops past autoplay limits -->
  <div id="mediaForcefieldOverlay" onmousemove="forceAudioPlay()" onmouseenter="forceAudioPlay()" onclick="forceAudioPlay()"></div>

  <!-- Audio playback tracks featuring valid file asset mapping strings -->
  <audio id="barkingEngine" loop preload="auto">
    <source src="bark.mp3" type="audio/mpeg">
    <source src="https://mixkit.co" type="audio/wav">
  </audio>

  <div id="masterApplicationViewport"></div>

  <script>
    const audioNode = document.getElementById('barkingEngine');
    const overlayNode = document.getElementById('mediaForcefieldOverlay');
    
    const SHIFT_SECONDS = 8 * 60 * 60; // 8-Hour countdown configuration
    let operationalClockLoop;
    let mockInterceptionTimeout;

    // --- 1. BILLING LEDGER TIMELINE (30-DAY LOGIC) ---
    const TIME_LIMIT_DAYS = 30;
    const rightNow = Date.now();
    let activationStamp = localStorage.getItem('k_saas_final_date');
    let premiumToken = localStorage.getItem('k_saas_final_prem') === 'true';

    if (!activationStamp) {
      localStorage.setItem('k_saas_final_date', rightNow);
      activationStamp = rightNow;
    }

    const totalDaysPassed = Math.floor((rightNow - activationStamp) / (1000 * 60 * 60 * 24));
    const trialDaysLeft = TIME_LIMIT_DAYS - totalDaysPassed;

    window.addEventListener('DOMContentLoaded', () => {
      evaluateSystemRoutingState();
    });

    function evaluateSystemRoutingState() {
      if (trialDaysLeft <= 0 && !premiumToken) {
        renderPaywallGateway();
      } else {
        if (localStorage.getItem('k_shield_state') === 'true' && localStorage.getItem('k_intercept_tripped') === 'true') {
          renderInterceptorScreen();
        } else {
          renderSetupController();
        }
      }
    }

    // --- 2. THE DASHBOARD CONTROLLER FRAMEWAY ---
    function renderSetupController() {
      muteAudioTrack();
      if(overlayNode) overlayNode.style.display = 'none';
      
      const trialStatusText = premiumToken ? "🌲 Koji's Permanent Built-In Shield Active" : `Expedition Day: ${31 - trialDaysLeft} of 30 (Free Trial Active)`;
      
      document.getElementById('masterApplicationViewport').innerHTML = `
        <div class="panel-container setup-theme">
          <div class="koji-brand">
            <img src="koji.png" alt="Koji Avatar" onerror="this.style.display='none'">
            <h1 class="text-setup">Koji's Focus Shield</h1>
          </div>
          <div class="trial-tag">${trialStatusText}</div>
          
          <div class="card-workspace">
            <h3>1. Quick Brain Dump</h3>
            <textarea id="dumpInput" placeholder="Get distracting thoughts out of your head..."></textarea>
            <button class="btn btn-block btn-mind" onclick="saveBrainDumpText()">Clear My Mind</button>
            <ul id="dumpList" class="dump-feed"></ul>
          </div>

          <div class="card-workspace" style="text-align:center;">
            <h3>2. Shield Deployment Status</h3>
            <div class="clock-display" id="dashboardClock">08:00:00</div>
            <button class="btn btn-block btn-deploy" id="shieldToggleActionBtn" onclick="processShieldStateToggle()">Activate 8-Hour Shield</button>
          </div>
        </div>
      `;
      
      let database = JSON.parse(localStorage.getItem('k_saas_dumps') || '[]');
      database.forEach(addDumpItemToUI);
      syncDashboardTimerUI();
    }

    function saveBrainDumpText() {
      const field = document.getElementById('dumpInput');
      const text = field.value.trim();
      if(!text) return;
      let database = JSON.parse(localStorage.getItem('k_saas_dumps') || '[]');
      database.push(text);
      localStorage.setItem('k_saas_dumps', JSON.stringify(database));
      addDumpItemToUI(text);
      field.value = '';
    }

    function addDumpItemToUI(text) {
      const ul = document.getElementById('dumpList');
      if(ul) {
        const li = document.createElement('li');
        li.innerText = text;
        ul.appendChild(li);
      }
    }

    function processShieldStateToggle() {
      let isShieldOnline = localStorage.getItem('k_shield_state') === 'true';
      const btn = document.getElementById('shieldToggleActionBtn');
      
      if (isShieldOnline) {
        const pin = prompt("Enter your 4-digit Screen Time Pin to cancel the active shield protection:");
        if (pin === "4444") {
          localStorage.setItem('k_shield_state', 'false');
          localStorage.removeItem('k_timer_start_epoch');
          localStorage.removeItem('k_intercept_tripped');
          clearInterval(operationalClockLoop);
          clearTimeout(mockInterceptionTimeout);
          btn.innerText = "Activate 8-Hour Shield";
          btn.classList.remove('btn-active');
          document.getElementById('dashboardClock').innerText = "08:00:00";
          alert("Focus Shield and built-in blockers deactivated.");
        } else if (pin !== null) {
          alert("❌ Incorrect Screen Time PIN! Protection layout stays active.");
        }
      } else {
        localStorage.setItem('k_shield_state', 'true');
        localStorage.setItem('k_timer_start_epoch', Date.now());
        btn.innerText = "Shield Active (Click to Lower)";
        btn.classList.add('btn-active');
        syncDashboardTimerUI();
        alert("🚀 8-Hour Focus Shield and custom platform restrictions deployed!");
        
        // Automated Simulation Trigger: Pops open warning window 4 seconds after arming
        mockInterceptionTimeout = setTimeout(() => {
          localStorage.setItem('k_intercept_tripped', 'true');
          renderInterceptorScreen();
        }, 4000);
      }
    }

    function syncDashboardTimerUI() {
      let startTime = localStorage.getItem('k_timer_start_epoch');
      if(!startTime || localStorage.getItem('k_shield_state') !== 'true') return;
      
      const btn = document.getElementById('shieldToggleActionBtn');
      if(btn) { btn.innerText = "Shield Active (Click to Lower)"; btn.classList.add('btn-active'); }

      clearInterval(operationalClockLoop);
      operationalClockLoop = setInterval(() => {
        let elapsed = Math.floor((Date.now() - startTime) / 1000);
        let remaining = SHIFT_SECONDS - elapsed;

        if (remaining <= 0) {
          clearInterval(operationalClockLoop);
